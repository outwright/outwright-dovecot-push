# /etc/dovecot/conf.d/90-outwright-push.conf (Dovecot 2.4)
# If a protocol lmtp or protocol lda block of yours sets its own mail_plugins, add the four
# plugins there too.
mail_attribute {
  dict file {
    path = %{home}/dovecot-attributes
  }
}
protocol imap {
  imap_metadata = yes
}
mail_plugins {
  notify = yes
  push_notification = yes
  mail_lua = yes
  push_notification_lua = yes
}
push_notification lua {
  lua_file = /usr/local/share/outwright/outwright-push.lua
  lua_settings {
    relay_base = https://push.outwright.app/v1/push/
  }
}
