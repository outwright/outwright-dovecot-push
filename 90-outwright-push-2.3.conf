# /etc/dovecot/conf.d/90-outwright-push.conf (Dovecot 2.3)
# If protocol lmtp or protocol lda sets mail_plugins at all, even with $mail_plugins, add the
# four plugins there too: Dovecot 2.3 does not carry a later global setting into an earlier
# protocol block, and doveconf -n warns about it.
mail_plugins = $mail_plugins notify push_notification mail_lua push_notification_lua
mail_attribute_dict = file:%h/dovecot-attributes
protocol imap {
  imap_metadata = yes
}
plugin {
  push_notification_driver = lua:file=/usr/local/share/outwright/outwright-push.lua
  outwright_push_relay_base = https://push.outwright.app/v1/push/
}
